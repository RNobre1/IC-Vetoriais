# Stack experimental — 3 SGBDs vetoriais em paralelo.
# Versões pinadas conforme vault/decisões/2026-05-06-bump-versoes-sgbds.md
# (supersede vault/decisões/2026-05-05-versoes-imagens-docker.md).
# Healthchecks garantem que `make smoke` espera o serviço estar pronto, não só "started".

services:
  postgres-pgvector:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    container_name: ic-pgvector
    environment:
      POSTGRES_DB: ${PG_DATABASE:-icvet}
      POSTGRES_USER: ${PG_USER:-icvet}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-icvet}
    ports:
      - "${PG_PORT:-5432}:5432"
    # `maintenance_work_mem` governa a construção do índice HNSW: com o default
    # de 64 MB da imagem, o grafo de 500 mil vetores de 384 dimensões (~732 MB
    # só de vetores) não cabe em memória e o pgvector recorre ao caminho
    # limitado por memória. Esse caminho derrubava o servidor em ~2/3 dos builds
    # de 500 mil, enquanto 100 mil passava 13 vezes seguidas.
    #
    # Além da instabilidade, o default herdado era assimétrico: o pgvector
    # construía com 64 MB enquanto Qdrant e Weaviate usam os defaults deles,
    # dimensionados para a tarefa. 2 GB cobre o grafo da maior escala medida.
    # Revisar antes de 1 milhão. Vide
    # vault/decisões/2026-08-22-medicao-de-footprint-e-tempo-de-indexacao.md
    command: >
      postgres
      -c maintenance_work_mem=2GB
      -c max_parallel_maintenance_workers=2
    # O Docker dá 64 MB de /dev/shm por default, e o PostgreSQL aloca ali a
    # memória compartilhada dinâmica dos workers paralelos
    # (dynamic_shared_memory_type = posix). O segmento é dimensionado por
    # `maintenance_work_mem`, então /dev/shm precisa ser maior que ele.
    shm_size: 3gb
    # Postgres 18 mudou o mount point do volume de /var/lib/postgresql/data para
    # /var/lib/postgresql (PGDATA passa a ser /var/lib/postgresql/18/docker).
    # Ver: https://github.com/docker-library/postgres/pull/1259
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-icvet} -d ${PG_DATABASE:-icvet}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ic-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # /healthz é endpoint nativo do Qdrant; não temos curl/wget garantidos na imagem oficial slim,
      # então usamos `bash` + `/dev/tcp` (built-in) para checar TCP-level no porto HTTP.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.37.2
    container_name: ic-weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "${WEAVIATE_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    volumes:
      - weaviatedata:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  weaviatedata:
