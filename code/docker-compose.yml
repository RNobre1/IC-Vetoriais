# Stack experimental — 3 SGBDs vetoriais em paralelo.
# Versões pinadas conforme vault/decisões/2026-05-06-bump-versoes-sgbds.md
# (supersede vault/decisões/2026-05-05-versoes-imagens-docker.md).
# Healthchecks garantem que `make smoke` espera o serviço estar pronto, não só "started".

services:
  postgres-pgvector:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    container_name: ic-pgvector
    environment:
      POSTGRES_DB: ${PG_DATABASE:-icvet}
      POSTGRES_USER: ${PG_USER:-icvet}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-icvet}
    ports:
      - "${PG_PORT:-5432}:5432"
    # O postmaster roda como PID 1 do contêiner e, nessa posição, adota e
    # recolhe todo processo órfão do namespace. Sob carga pesada o healthcheck
    # `pg_isready` ultrapassa seu timeout de 3 s — o fsync de checkpoint chegou
    # a 13 s nas medições —, o Docker o mata, o órfão é reparentado ao PID 1, e
    # o postmaster trata o PID desconhecido como filho que quebrou, derrubando o
    # cluster: `untracked child process ... exited with exit code 2`. O código 2
    # é justamente o que o `pg_isready` retorna para "sem resposta".
    #
    # Medido em cargas de 500 mil linhas: 5 quedas em 27 sem `init`; 0 em 15
    # com `init` e o healthcheck ligado. Um init de verdade como PID 1 recolhe
    # os órfãos e tira o postmaster dessa função.
    #
    # Não altera imagem nem parâmetro do servidor: as versões seguem as fixadas
    # em vault/decisões/2026-05-06-bump-versoes-sgbds.md e declaradas no §6.1.
    init: true
    # A construção paralela do índice HNSW aloca em /dev/shm um segmento
    # dimensionado por `maintenance_work_mem`. Medido: 63.752 KB usados contra
    # os 64 MB que o Docker dá por default — 2,7% de folga. Ampliar é
    # capacidade, não comportamento: ou a alocação cabe, e o resultado é
    # idêntico, ou o servidor cai.
    shm_size: 1gb
    # Postgres 18 mudou o mount point do volume de /var/lib/postgresql/data para
    # /var/lib/postgresql (PGDATA passa a ser /var/lib/postgresql/18/docker).
    # Ver: https://github.com/docker-library/postgres/pull/1259
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-icvet} -d ${PG_DATABASE:-icvet}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ic-qdrant
    init: true
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # /healthz é endpoint nativo do Qdrant; não temos curl/wget garantidos na imagem oficial slim,
      # então usamos `bash` + `/dev/tcp` (built-in) para checar TCP-level no porto HTTP.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.37.2
    container_name: ic-weaviate
    init: true
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "${WEAVIATE_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    volumes:
      - weaviatedata:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  weaviatedata:
